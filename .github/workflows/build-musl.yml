# 基于 musl-cross-make 在 x86_64 runner 上构建多架构交叉工具链（binutils + gcc/g++ + musl）
#
# 触发方式：Actions -> 本 workflow -> Run workflow（可留空版本号自动取 musl.libc.org 最新版）
# 产物：musl-cross-<musl版本>-gcc<GCC版本>-<构建日期(UTC)>-<架构>.tar.gz
#       完整的 x86_64 -> <target> 交叉工具链（含 C/C++ 编译器与 musl sysroot），解压即用
# Release tag：musl-cross-<musl版本>-gcc<GCC版本>-<构建日期(UTC)>，例如 musl-cross-1.2.6-gcc13.3.0-20261026
#
# 注意：工具链中的 gcc/binutils 是 x86_64 Linux 程序，动态链接构建机的 glibc；
#       在较老发行版上使用时需确认 glibc 版本兼容性。
#
# matrix 覆盖：amd64(x86_64) / arm64(aarch64) / armv7(armhf) / mips(o32) / mipsle(o32, 小端)
# 说明：
#   - MIPS 默认使用 soft-float（target 带 sf 后缀），适配常见 mips/mipsel 嵌入式设备；
#     若目标为 hard-float，把 matrix 中的 target 改成 mips-linux-musl / mipsel-linux-musl。
#   - 需要给 musl 打补丁时，在本仓库根目录放 patches/musl-<版本>/*.patch，
#     workflow 会复制到 musl-cross-make/patches/（解包时自动应用）。
#   - 可移植性：musl-cross-make 不写死绝对路径；构建完成后会校验产物中不含构建机路径、
#     无 RPATH/RUNPATH，并用 QEMU 在隔离 sysroot 中实际运行编译出的程序。

name: Build musl (multi-arch cross compile)

on:
  # 仅手动触发
  workflow_dispatch:
    inputs:
      musl_version:
        description: "musl 版本，例如 1.2.6；留空则自动获取 musl.libc.org 最新版本"
        required: false
        default: ""
        type: string
      gcc_version:
        description: "GCC 版本（musl-cross-make 支持：9.4.0 / 10.3.0 / 11.2.0 / 11.5.0 / 12.4.0 / 13.3.0 / 14.2.0 / 14.3.0 / 15.1.0）"
        required: false
        default: "13.3.0"
        type: string
      publish:
        description: "构建成功后创建 Tag 与 GitHub Release"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-musl-${{ github.ref }}
  cancel-in-progress: false

env:
  MUSL_SITE: https://musl.libc.org
  MCM_REPO: https://github.com/richfelker/musl-cross-make

jobs:
  # ---------------------------------------------------------------------------
  # 1. 解析要构建的 musl 版本（默认取官方发布页上的最新版）
  # ---------------------------------------------------------------------------
  resolve:
    name: Resolve musl version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      musl_version: ${{ steps.detect.outputs.version }}
      build_date: ${{ steps.date.outputs.date }}
      gcc_version: ${{ steps.gcc.outputs.version }}
    steps:
      - name: Detect latest musl release
        id: detect
        env:
          INPUT_VERSION: ${{ inputs.musl_version }}
        run: |
          set -euo pipefail
          ver="$(printf '%s' "$INPUT_VERSION" | tr -d '[:space:]' | sed -E 's/^v//')"

          if [ -z "$ver" ]; then
            ver="$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 \
              "$MUSL_SITE/releases.html" \
              | grep -oE 'releases/musl-[0-9]+(\.[0-9]+){1,2}\.tar\.gz' \
              | sed -E 's#^releases/musl-##; s#\.tar\.gz$##' \
              | sort -uV | tail -n1 || true)"
          fi

          if [ -z "$ver" ]; then
            echo "::warning::解析 releases.html 失败，回退到 git tag"
            ver="$(git ls-remote --tags --refs https://github.com/bminor/musl.git 'refs/tags/v*' \
              | sed -nE 's#.*refs/tags/v##p' \
              | grep -E '^[0-9]+(\.[0-9]+){1,2}$' \
              | sort -V | tail -n1 || true)"
          fi

          if ! printf '%s' "$ver" | grep -qE '^[0-9]+(\.[0-9]+){1,2}$'; then
            echo "::error::无法确定 musl 版本（得到 '$ver'），请在手动触发时指定 musl_version"
            exit 1
          fi

          echo "musl version: $ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          {
            echo "## 解析结果"
            echo ""
            echo "- musl 版本: \`$ver\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compute build date (UTC)
        id: date
        run: |
          set -euo pipefail
          date_utc="$(date -u +%Y%m%d)"
          echo "构建日期（UTC）：$date_utc"
          echo "date=$date_utc" >> "$GITHUB_OUTPUT"
          echo "- 构建日期（UTC）: \`$date_utc\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve GCC version
        id: gcc
        env:
          INPUT_GCC: ${{ inputs.gcc_version }}
        run: |
          set -euo pipefail
          ver="$(printf '%s' "$INPUT_GCC" | tr -d '[:space:]')"
          if ! printf '%s' "$ver" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::GCC 版本格式不正确：'$ver'（示例：13.3.0）"
            exit 1
          fi
          echo "GCC version: $ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "- GCC 版本: \`$ver\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 2. 每个架构一个 job，并行交叉编译
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            target: x86_64-linux-musl
            machine: X86-64
            qemu: ""
            gcc_extra: ""

          - name: arm64
            target: aarch64-linux-musl
            machine: AArch64
            qemu: qemu-aarch64-static
            gcc_extra: ""

          - name: armv7
            # armhf：ARMv7-A + VFPv3-D16 + hard-float
            target: arm-linux-musleabihf
            machine: ARM
            qemu: qemu-arm-static
            gcc_extra: "--with-arch=armv7-a --with-fpu=vfpv3-d16"

          - name: mips
            # 若目标为 hard-float，改为 mips-linux-musl
            target: mips-linux-muslsf
            machine: MIPS
            qemu: qemu-mips-static
            gcc_extra: ""

          - name: mipsle
            # 小端 MIPS；若目标为 hard-float，改为 mipsel-linux-musl
            target: mipsel-linux-muslsf
            machine: MIPS
            qemu: qemu-mipsel-static
            gcc_extra: ""

    env:
      MUSL_VER: ${{ needs.resolve.outputs.musl_version }}
      BUILD_DATE: ${{ needs.resolve.outputs.build_date }}
      GCC_VER: ${{ needs.resolve.outputs.gcc_version }}
      TARGET: ${{ matrix.target }}
      WORKDIR: ${{ github.workspace }}
      GCC_EXTRA: ${{ matrix.gcc_extra }}
      QEMU: ${{ matrix.qemu }}
      EXPECT_MACHINE: ${{ matrix.machine }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex gawk patch m4 texinfo xz-utils file \
            wget curl ca-certificates
          # 运行时冒烟测试用；拿不到就跳过运行测试，不影响产物
          sudo apt-get install -y --no-install-recommends qemu-user-static \
            || echo "::warning::qemu-user-static 不可用，将跳过运行时冒烟测试"

      - name: Fetch musl-cross-make
        run: |
          set -euo pipefail
          git clone --depth 1 "$MCM_REPO" "$WORKDIR/musl-cross-make"
          git -C "$WORKDIR/musl-cross-make" log -1 --format='musl-cross-make commit: %H %s'

      - name: Apply optional local patches
        run: |
          set -euo pipefail
          # 仓库根目录若存在 patches/musl-<版本>/*.patch，则交给 musl-cross-make 在解包时应用
          if [ -d "$WORKDIR/patches" ]; then
            cp -a "$WORKDIR/patches/." "$WORKDIR/musl-cross-make/patches/"
            find "$WORKDIR/musl-cross-make/patches" -name '*.patch' | sort
          else
            echo "no local patches directory, skipped"
          fi

      - name: Restore upstream tarball cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/musl-cross-make/sources
          key: musl-cross-make-sources-v1
          restore-keys: |
            musl-cross-make-sources-

      - name: Prepare musl source tarball
        run: |
          set -euo pipefail
          cd "$WORKDIR/musl-cross-make"
          mkdir -p sources hashes

          # 缓存恢复的 tarball mtime 通常早于本次 clone 出来的 hashes/*.sha1，
          # make 会误判为过期并重新下载；统一 touch，缓存才真正生效
          find sources -maxdepth 1 -type f \
            \( -name '*.tar.gz' -o -name '*.tar.xz' -o -name '*.tar.bz2' \) \
            -exec touch {} +

          tarball="musl-${MUSL_VER}.tar.gz"
          if [ -s "sources/$tarball" ] && ! tar -tzf "sources/$tarball" > /dev/null 2>&1; then
            echo "cached $tarball 已损坏，重新下载"
            rm -f "sources/$tarball"
          fi
          if [ ! -s "sources/$tarball" ]; then
            echo "Downloading $MUSL_SITE/releases/$tarball"
            curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 \
              -o "sources/$tarball.part" "$MUSL_SITE/releases/$tarball"
            mv "sources/$tarball.part" "sources/$tarball"
          fi

          # gzip 完整性检查（截断的下载会在这里失败）
          tar -tzf "sources/$tarball" > /dev/null
          sha256sum "sources/$tarball" | tee -a "$GITHUB_STEP_SUMMARY"

          # musl-cross-make 只下载 hashes/ 里已收录的版本；
          # 若最新版还没被收录，这里补一个 sha1，make 才不会报 "no rule to make target"
          if [ ! -f "hashes/$tarball.sha1" ]; then
            echo "hashes/$tarball.sha1 不存在，生成之"
            ( cd sources && sha1sum "$tarball" > "../hashes/$tarball.sha1" )
          fi
          ( cd sources && sha1sum -c "../hashes/$tarball.sha1" )

          # 让 tarball 比 sha1 文件更新，避免 make 重复下载
          touch "sources/$tarball"

      - name: Prefetch upstream source tarballs
        run: |
          set -euo pipefail
          cd "$WORKDIR/musl-cross-make"

          ver() { sed -n "s/^$1 = //p" Makefile; }
          BINUTILS_VER="$(ver BINUTILS_VER)"
          GMP_VER="$(ver GMP_VER)"
          MPC_VER="$(ver MPC_VER)"
          MPFR_VER="$(ver MPFR_VER)"
          LINUX_VER="$(ver LINUX_VER)"

          # GCC 版本由 workflow 输入决定；只接受 musl-cross-make 已收录（有 hash/补丁）的版本
          GCC_HASH="$(ls hashes/gcc-${GCC_VER}.tar.* 2>/dev/null | sort | sed -n '1p' || true)"
          if [ -z "$GCC_HASH" ]; then
            echo "::error::musl-cross-make 不支持 GCC ${GCC_VER}，可用版本："
            ls hashes/gcc-*.tar.* 2>/dev/null | sed -E 's#^hashes/gcc-(.*)\.tar\..*#  \1#' || true
            exit 1
          fi
          GCC_TARBALL="$(basename "$GCC_HASH" .sha1)"

          # ftpmirror.gnu.org 会重定向到 mirrors.ibiblio.org，make -j 的并发下载
          # 容易触发 403 限流。这里串行地从多个镜像预取。
          fetch_gnu() {
            local rel="$1" out="$2" base
            for base in \
              https://mirrors.kernel.org/gnu \
              https://mirrors.ocf.berkeley.edu/gnu \
              https://ftp.gnu.org/gnu; do
              if [ -s "$out" ]; then
                return 0
              fi
              echo "==> $base/$rel"
              if curl -fL --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 20 \
                   -o "$out.part" "$base/$rel"; then
                mv "$out.part" "$out"
                return 0
              fi
              rm -f "$out.part"
              echo "::warning::$base/$rel 下载失败，尝试下一个镜像"
            done
            return 1
          }

          fetch_gnu "binutils/binutils-${BINUTILS_VER}.tar.gz" \
            "sources/binutils-${BINUTILS_VER}.tar.gz" \
            || echo "::warning::binutils 预下载失败，稍后由 make 重试"
          fetch_gnu "gcc/gcc-${GCC_VER}/${GCC_TARBALL}" \
            "sources/${GCC_TARBALL}" \
            || echo "::warning::gcc 预下载失败，稍后由 make 重试"
          fetch_gnu "gmp/gmp-${GMP_VER}.tar.xz" \
            "sources/gmp-${GMP_VER}.tar.xz" \
            || echo "::warning::gmp 预下载失败，稍后由 make 重试"
          fetch_gnu "mpc/mpc-${MPC_VER}.tar.gz" \
            "sources/mpc-${MPC_VER}.tar.gz" \
            || echo "::warning::mpc 预下载失败，稍后由 make 重试"
          fetch_gnu "mpfr/mpfr-${MPFR_VER}.tar.xz" \
            "sources/mpfr-${MPFR_VER}.tar.xz" \
            || echo "::warning::mpfr 预下载失败，稍后由 make 重试"

          if [ -n "$LINUX_VER" ]; then
            LINUX_TARBALL="linux-${LINUX_VER}.tar.xz"
            if [ ! -s "sources/$LINUX_TARBALL" ]; then
              echo "==> linux headers: $LINUX_TARBALL"
              if curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 \
                   -o "sources/$LINUX_TARBALL.part" \
                   "https://ftp.barfooze.de/pub/sabotage/tarballs/$LINUX_TARBALL"; then
                mv "sources/$LINUX_TARBALL.part" "sources/$LINUX_TARBALL"
              else
                rm -f "sources/$LINUX_TARBALL.part"
                echo "::warning::linux headers 预下载失败，稍后由 make 重试"
              fi
            fi
          fi

          # 校验已有 hashes，并让 tarball 比 sha1 文件新，make 才不会重复下载
          for f in sources/*.tar.gz sources/*.tar.xz sources/*.tar.bz2; do
            [ -f "$f" ] || continue
            base="$(basename "$f")"
            if [ -f "hashes/$base.sha1" ]; then
              ( cd sources && sha1sum -c "../hashes/$base.sha1" )
            fi
            touch "$f"
          done

      - name: Configure musl-cross-make
        run: |
          set -euo pipefail
          cd "$WORKDIR/musl-cross-make"
          {
            echo "TARGET = $TARGET"
            echo "MUSL_VER = $MUSL_VER"
            echo "GCC_VER = $GCC_VER"
            echo "OUTPUT = $WORKDIR/output"
            # 兜底：make 自身的下载也改用 curl + 重试
            echo "DL_CMD = curl -fL --retry 3 --retry-all-errors --retry-delay 2 -o"
            # 完整 C/C++ 交叉工具链：binutils + gcc/g++ + libstdc++ + musl sysroot
            # --disable-nls 减少体积；debug-prefix-map 保证工具链内不出现构建机路径
            echo "COMMON_CONFIG += --disable-nls"
            echo "GCC_CONFIG += --with-debug-prefix-map=$WORKDIR=/"
            if [ -n "$GCC_EXTRA" ]; then
              echo "GCC_CONFIG += $GCC_EXTRA"
            fi
          } > config.mak
          echo "----- config.mak -----"
          cat config.mak

      - name: Build and install cross toolchain
        run: |
          set -euo pipefail
          cd "$WORKDIR/musl-cross-make"
          # 构建 binutils + gcc/g++ + libgcc/libstdc++ + musl，然后安装：
          # 工具链装到 output/{bin,lib,libexec}，sysroot（musl 头文件/库）装到 output/<target>
          make -j"$(nproc)"
          make install
          ls -la "$WORKDIR/output"

      - name: Verify toolchain and sysroot
        run: |
          set -euo pipefail
          ROOT="$WORKDIR/output/$TARGET"
          BIN="$WORKDIR/output/bin"

          test -f "$ROOT/lib/libc.a" || { echo "::error::missing $ROOT/lib/libc.a"; exit 1; }
          test -d "$ROOT/include" || { echo "::error::missing $ROOT/include"; exit 1; }
          for tool in "$TARGET-gcc" "$TARGET-g++" "$TARGET-ld" "$TARGET-ar"; do
            test -x "$BIN/$tool" || { echo "::error::missing $BIN/$tool"; exit 1; }
          done
          ls -l "$BIN"
          ls -l "$ROOT/lib"

          # C/C++ 编译器与默认 sysroot
          "$BIN/$TARGET-gcc" --version | sed -n '1p'
          "$BIN/$TARGET-g++" --version | sed -n '1p'
          echo "default sysroot: $("$BIN/$TARGET-gcc" -print-sysroot)"

          # arm/mips 上 lib/libc.so 可能是 linker script，真正的 ELF 是 ld-musl-*.so.1
          ELF=""
          for f in "$ROOT"/lib/ld-musl-*.so.1 "$ROOT"/lib/libc.so; do
            [ -e "$f" ] || continue
            if readelf -h "$f" > /dev/null 2>&1; then
              ELF="$(readlink -f "$f")"
              break
            fi
          done
          [ -n "$ELF" ] || { echo "::error::no ELF shared object found in $ROOT/lib"; exit 1; }

          echo "runtime ELF: $ELF"
          readelf -h "$ELF" | tee /tmp/readelf-header.txt
          grep -q "$EXPECT_MACHINE" /tmp/readelf-header.txt \
            || { echo "::error::ELF machine mismatch, expected '$EXPECT_MACHINE'"; exit 1; }

          if readelf -d "$ELF" | grep -E 'RPATH|RUNPATH' > /dev/null; then
            echo "::error::RPATH/RUNPATH found in $ELF"
            exit 1
          fi
          if strings -a "$ELF" | grep -F "$WORKDIR" > /dev/null; then
            echo "::error::build-machine path leaked into $ELF"
            exit 1
          fi

          # target 侧的 musl 库不应包含构建路径。
          # 注意：host 工具链二进制里出现 --with-build-sysroot 等构建期配置路径是正常的，
          # 不能据此判定不可移动；真正的可移动性由打包后的解压编译测试验证。
          if strings -a "$ROOT/lib/libc.a" | grep -F "$WORKDIR" > /dev/null; then
            echo "::error::build-machine path leaked into libc.a"
            exit 1
          fi

          echo "toolchain / sysroot checks passed"

      - name: Package cross toolchain
        run: |
          set -euo pipefail
          PKG="musl-cross-${MUSL_VER}-gcc${GCC_VER}-${BUILD_DATE}-${{ matrix.name }}"
          STAGE="$WORKDIR/dist/stage/$PKG"
          rm -rf "$WORKDIR/dist/stage"
          mkdir -p "$STAGE"

          # 完整工具链：bin/（gcc/g++/binutils）、lib/、libexec/ 以及 <target>/ sysroot
          cp -a "$WORKDIR/output/." "$STAGE/"

          # musl 安装的 ld-musl-*.so.1 默认是指向 /lib/libc.so 的绝对链接，
          # 在可移动 sysroot 中会被解析到宿主机 /lib；改成同目录相对链接
          for dso in "$STAGE/$TARGET"/lib/ld-musl-*.so.1; do
            [ -L "$dso" ] || continue
            case "$(readlink "$dso")" in
              /*) ln -sfn libc.so "$dso" ;;
            esac
          done

          # 去掉文档/本地化文件，减小发布体积（不影响编译功能）
          rm -rf "$STAGE/share/man" "$STAGE/share/info" "$STAGE/share/doc" "$STAGE/share/locale"

          # strip host 端可执行文件（sysroot 里的 target 库不动）
          find "$STAGE/bin" "$STAGE/libexec" -type f -perm -u+x -print0 \
            | xargs -0 -r strip --strip-unneeded 2>/dev/null || true

          # 相对路径 sysroot 包装器：工具链解压到任意目录都能直接编译
          cat > "$STAGE/bin/${TARGET}-musl-gcc" <<EOF
          #!/bin/sh
          dir=\$(CDPATH= cd -- "\$(dirname -- "\$0")" && pwd)
          exec "\$dir/${TARGET}-gcc" --sysroot="\$dir/../${TARGET}" "\$@"
          EOF
          cat > "$STAGE/bin/${TARGET}-musl-g++" <<EOF
          #!/bin/sh
          dir=\$(CDPATH= cd -- "\$(dirname -- "\$0")" && pwd)
          exec "\$dir/${TARGET}-g++" --sysroot="\$dir/../${TARGET}" "\$@"
          EOF
          chmod +x "$STAGE/bin/${TARGET}-musl-gcc" "$STAGE/bin/${TARGET}-musl-g++"

          cat > "$STAGE/README.txt" <<EOF
          musl-cross ${MUSL_VER} (${BUILD_DATE})
          host: $(uname -m)   target: ${TARGET}

          usage:
            export PATH="\$PWD/bin:\$PATH"
            ${TARGET}-musl-gcc hello.c -o hello
            ${TARGET}-musl-g++ hello.cc -o hello-cpp

          ${TARGET}-musl-gcc / ${TARGET}-musl-g++ are wrappers that pass
          --sysroot="\$PWD/${TARGET}" automatically, so this toolchain works
          from any directory. The standard ${TARGET}-gcc / ${TARGET}-g++
          are included as well.
          EOF

          out="$WORKDIR/dist/$PKG.tar.gz"
          tar --sort=name --owner=0 --group=0 --numeric-owner -C "$WORKDIR/dist/stage" -czf "$out" "$PKG"
          ( cd "$WORKDIR/dist" && sha256sum "$PKG.tar.gz" | tee "$PKG.tar.gz.sha256" )

          du -sh "$out"
          find "$STAGE" -maxdepth 1 -mindepth 1 | sort | sed "s#$STAGE/##"

      - name: Smoke test (packaged toolchain)
        run: |
          set -euo pipefail
          PKG="musl-cross-${MUSL_VER}-gcc${GCC_VER}-${BUILD_DATE}-${{ matrix.name }}"
          rm -rf "/tmp/$PKG"
          tar -C /tmp -xzf "$WORKDIR/dist/$PKG.tar.gz"
          TC="/tmp/$PKG"
          ROOT="$TC/$TARGET"

          test -x "$TC/bin/${TARGET}-musl-gcc" || { echo "::error::missing ${TARGET}-musl-gcc"; exit 1; }
          test -x "$TC/bin/${TARGET}-musl-g++" || { echo "::error::missing ${TARGET}-musl-g++"; exit 1; }

          # gcc 的默认 sysroot 是相对于自身位置的，应跟随解压目录
          relocated="$("$TC/bin/${TARGET}-gcc" -print-sysroot)"
          echo "relocated default sysroot: $relocated"
          case "$relocated" in
            "$TC"*) echo "standard gcc sysroot follows the toolchain location" ;;
            *) echo "::warning::standard gcc default sysroot is $relocated; use ${TARGET}-musl-gcc wrapper" ;;
          esac

          mkdir -p /tmp/smoke
          cat > /tmp/smoke/hello.c <<'EOF'
          #include <stdio.h>
          #include <string.h>

          int main(void)
          {
              char buf[64];
              snprintf(buf, sizeof buf, "hello from musl %s", "libc");
              puts(buf);
              return strcmp(buf, "hello from musl libc") != 0;
          }
          EOF

          cat > /tmp/smoke/hello.cc <<'EOF'
          #include <iostream>
          #include <string>

          int main()
          {
              std::string s = "hello from musl g++";
              std::cout << s << std::endl;
              return s.empty();
          }
          EOF

          # 只用解压后的工具链，验证其不依赖构建机/构建目录
          "$TC/bin/${TARGET}-musl-gcc" -O2 -static /tmp/smoke/hello.c -o /tmp/smoke/hello-static
          "$TC/bin/${TARGET}-musl-gcc" -O2 /tmp/smoke/hello.c -o /tmp/smoke/hello-dynamic
          "$TC/bin/${TARGET}-musl-g++" -O2 -static /tmp/smoke/hello.cc -o /tmp/smoke/hello-cxx
          file /tmp/smoke/hello-static /tmp/smoke/hello-dynamic /tmp/smoke/hello-cxx

          if [ -n "$QEMU" ] && command -v "$QEMU" > /dev/null 2>&1; then
            echo "running under $QEMU (sysroot: $ROOT)"
            "$QEMU" /tmp/smoke/hello-static
            "$QEMU" -L "$ROOT" /tmp/smoke/hello-dynamic
            "$QEMU" /tmp/smoke/hello-cxx
          elif [ "$TARGET" = "x86_64-linux-musl" ]; then
            echo "running natively"
            /tmp/smoke/hello-static
            "$ROOT/lib/ld-musl-x86_64.so.1" /tmp/smoke/hello-dynamic
            /tmp/smoke/hello-cxx
          else
            echo "::warning::没有可用的 $TARGET 模拟器，跳过运行测试"
          fi

      - name: Upload toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: musl-cross-${{ env.MUSL_VER }}-gcc${{ env.GCC_VER }}-${{ env.BUILD_DATE }}-${{ matrix.target }}
          path: |
            ${{ github.workspace }}/dist/musl-cross-${{ env.MUSL_VER }}-gcc${{ env.GCC_VER }}-${{ env.BUILD_DATE }}-${{ matrix.name }}.tar.gz
            ${{ github.workspace }}/dist/musl-cross-${{ env.MUSL_VER }}-gcc${{ env.GCC_VER }}-${{ env.BUILD_DATE }}-${{ matrix.name }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 9
          retention-days: 7

      - name: Write job summary
        if: always()
        run: |
          PKG="musl-cross-${MUSL_VER}-gcc${GCC_VER}-${BUILD_DATE}-${{ matrix.name }}"
          {
            echo "## ${PKG}"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| musl 版本 | \`${MUSL_VER}\` |"
            echo "| 构建日期 | \`${BUILD_DATE}\` |"
            echo "| host -> target | \`$(uname -m)\` -> \`${TARGET}\` |"
            echo "| 构建机 | \`$(nproc)\` cores |"
            echo "| 产物 | \`${PKG}.tar.gz\` |"
            echo ""
            echo "解压后即可使用（包含 gcc/g++/binutils + musl sysroot）："
            echo ""
            echo '```'
            echo "tar -xzf ${PKG}.tar.gz -C /opt"
            echo "export PATH=/opt/${PKG}/bin:\$PATH"
            echo "${TARGET}-musl-gcc hello.c -o hello"
            echo "${TARGET}-musl-g++ hello.cc -o hello-cpp"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 3. 发布：创建 Tag 与 GitHub Release，并把全部架构的产物作为 Release 资产上传
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: [resolve, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # softprops/action-gh-release 创建 Release、push tag 需要
    env:
      MUSL_VER: ${{ needs.resolve.outputs.musl_version }}
      GCC_VER: ${{ needs.resolve.outputs.gcc_version }}
      BUILD_DATE: ${{ needs.resolve.outputs.build_date }}
      TAG: musl-cross-${{ needs.resolve.outputs.musl_version }}-gcc${{ needs.resolve.outputs.gcc_version }}-${{ needs.resolve.outputs.build_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 取完整 tag 历史，用于判断 tag 是否已存在

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check assets and build SHA256SUMS
        run: |
          set -euo pipefail
          ls -lh dist

          missing=0
          for arch in amd64 arm64 armv7 mips mipsle; do
            f="dist/musl-cross-${MUSL_VER}-gcc${GCC_VER}-${BUILD_DATE}-${arch}.tar.gz"
            if [ ! -f "$f" ]; then
              echo "::error::缺少产物 $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

          ( cd dist && sha256sum musl-cross-*.tar.gz | sort -k2 > SHA256SUMS )
          cat dist/SHA256SUMS

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Tag $TAG 已存在，跳过 tag 创建，仅更新 Release 资产"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Git Tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Tag $TAG created"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: musl-cross ${{ env.MUSL_VER }} / GCC ${{ env.GCC_VER }} (${{ env.BUILD_DATE }})
          body: |
            ## musl-cross ${{ env.MUSL_VER }} / GCC ${{ env.GCC_VER }}（${{ env.BUILD_DATE }} 构建）

            x86_64 主机上的多架构交叉编译工具链：binutils + gcc/g++ + musl sysroot，解压即用。

            | 项目 | 值 |
            | --- | --- |
            | musl 版本 | `${{ env.MUSL_VER }}` |
            | GCC 版本 | `${{ env.GCC_VER }}` |
            | 构建日期（UTC） | `${{ env.BUILD_DATE }}` |
            | 构建提交 | `${{ github.sha }}` |
            | host | x86_64 Linux（gcc/binutils 动态链接 glibc） |
            | 构建方式 | [musl-cross-make](https://github.com/richfelker/musl-cross-make) |

            | 资产 | target | 说明 |
            | --- | --- | --- |
            | `musl-cross-${{ env.MUSL_VER }}-gcc${{ env.GCC_VER }}-${{ env.BUILD_DATE }}-amd64.tar.gz` | `x86_64-linux-musl` | x86_64 |
            | `musl-cross-${{ env.MUSL_VER }}-gcc${{ env.GCC_VER }}-${{ env.BUILD_DATE }}-arm64.tar.gz` | `aarch64-linux-musl` | AArch64 |
            | `musl-cross-${{ env.MUSL_VER }}-gcc${{ env.GCC_VER }}-${{ env.BUILD_DATE }}-armv7.tar.gz` | `arm-linux-musleabihf` | ARMv7-A + VFPv3-D16，hard-float |
            | `musl-cross-${{ env.MUSL_VER }}-gcc${{ env.GCC_VER }}-${{ env.BUILD_DATE }}-mips.tar.gz` | `mips-linux-muslsf` | MIPS o32，大端，soft-float |
            | `musl-cross-${{ env.MUSL_VER }}-gcc${{ env.GCC_VER }}-${{ env.BUILD_DATE }}-mipsle.tar.gz` | `mipsel-linux-muslsf` | MIPS o32，小端，soft-float |

            使用（以 armv7 为例）：

            ```bash
            tar -xzf musl-cross-${{ env.MUSL_VER }}-gcc${{ env.GCC_VER }}-${{ env.BUILD_DATE }}-armv7.tar.gz -C /opt
            export PATH=/opt/musl-cross-${{ env.MUSL_VER }}-gcc${{ env.GCC_VER }}-${{ env.BUILD_DATE }}-armv7/bin:$PATH

            arm-linux-musleabihf-musl-gcc hello.c -o hello
            arm-linux-musleabihf-musl-g++ hello.cc -o hello-cpp
            ```

            - `*-musl-gcc` / `*-musl-g++` 会自动带上相对路径的 `--sysroot`，工具链可解压到任意目录
            - 包内同时包含标准的 `<target>-gcc` / `<target>-g++` 与 binutils
            - 校验：`sha256sum -c SHA256SUMS`
            - `mips` / `mipsle` 默认 soft-float（o32）；需要 hard-float 时修改 workflow matrix 中的 target 后重新运行
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          files: |
            dist/musl-cross-*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
